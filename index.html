<style>

    --bg:#F3F1EC;
    --surface:#FFFFFF;
    --surface-2:#EDEAE2;
    --ink:#1C2521;
    --ink-dim:#5B6B63;
    --line:#DEDACD;
    --brand:#2B6E5C;
    --brand-ink:#F4FBF7;
    --amber:#D97C2B;
    --amber-ink:#3A2205;
    --danger:#B3432E;
    --ok:#2B6E5C;
    --chip-bg:#E4EEE9;
    --shadow: 0 1px 2px rgba(28,37,33,.06), 0 6px 20px -8px rgba(28,37,33,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12211C;
      --surface:#17281F;
      --surface-2:#1D3126;
      --ink:#EAF2EC;
      --ink-dim:#9FB8AB;
      --line:#28402F;
      --brand:#59C6A0;
      --brand-ink:#092F23;
      --amber:#F0A15D;
      --amber-ink:#2C1600;
      --danger:#F0876F;
      --ok:#59C6A0;
      --chip-bg:#1F3A2C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.55);

  :root[data-theme="dark"]{

    --line:#28402F; --brand:#59C6A0; --brand-ink:#092F23; --amber:#F0A15D; --amber-ink:#2C1600;
    --danger:#F0876F; --ok:#59C6A0; --chip-bg:#1F3A2C; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.55);

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{

  html{height:100%;}
  .app{max-width:460px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

  .badge-demo{
    display:flex; align-items:center; gap:6px; justify-content:center;
    font-size:11px; font-weight:600; color:var(--ink-dim); letter-spacing:.04em; text-transform:uppercase;
    padding:8px 0 2px;
  }
  .badge-demo svg{width:12px; height:12px; flex:none;}

  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    background:var(--bg);
    padding-top:6px; padding-bottom:10px;
    display:flex; align-items:center; gap:10px;
  }
  header.top .back{
    width:36px; height:36px; border-radius:11px; border:1px solid var(--line);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    flex:none; color:var(--ink); cursor:pointer;
  }
  header.top .back svg{width:18px; height:18px;}
  header.top .titles{min-width:0; flex:1;}
  header.top h1{font-family:'Manrope',sans-serif; font-weight:800; font-size:18px; margin:0; line-height:1.15;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header.top .sub{font-size:12px; color:var(--ink-dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .brandmark{display:flex; align-items:center; gap:8px; padding:10px 0 6px;}
  .brandmark .mark{
    width:34px; height:34px; border-radius:10px; background:var(--brand); color:var(--brand-ink);
    display:flex; align-items:center; justify-content:center; font-family:'Manrope'; font-weight:800; font-size:15px;
    flex:none;
  }
  .brandmark .name{font-family:'Manrope'; font-weight:800; font-size:17px;}
  .brandmark .tag{font-size:11px; color:var(--ink-dim);}

  main{flex:1; padding-bottom:28px;}

  .search{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; margin:4px 0 14px;
  }
  .search svg{width:16px; height:16px; color:var(--ink-dim); flex:none;}
  .search input{
    border:none; outline:none; background:transparent; color:var(--ink); font-size:14px; width:100%;
    font-family:'IBM Plex Sans';
  }
  .search input::placeholder{color:var(--ink-dim);}

  .section-label{font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-dim); margin:18px 2px 8px;}
  .section-label:first-child{margin-top:0;}

  .card-list{display:flex; flex-direction:column; gap:10px;}

  .proj-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 14px;
    box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column; gap:8px;
  }
  .proj-card .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .proj-card .cod{font-family:'IBM Plex Mono'; font-size:11px; color:var(--brand); font-weight:600; letter-spacing:.03em;}
  .proj-card h3{font-family:'Manrope'; font-size:15.5px; font-weight:700; margin:2px 0 0; line-height:1.25;}
  .proj-card .cli{font-size:12.5px; color:var(--ink-dim); margin-top:2px;}
  .proj-card .row2{display:flex; justify-content:space-between; align-items:center; margin-top:2px;}
  .proj-card .total{font-family:'IBM Plex Mono'; font-weight:600; font-size:15px; font-variant-numeric:tabular-nums;}
  .proj-card .pct-pill{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--chip-bg); color:var(--brand);
    font-variant-numeric:tabular-nums;
  }
  .proj-card .bar-track{height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
  .proj-card .bar-fill{height:100%; background:var(--brand); border-radius:99px;}

  .tabs{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:13px; margin-bottom:14px;}
  .tabs button{
    flex:1; border:none; background:transparent; padding:9px 6px; border-radius:10px; font-size:12.5px;
    font-weight:700; color:var(--ink-dim); font-family:'Manrope'; cursor:pointer;
  }
  .tabs button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}

  .chiprow{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; margin:0 -2px;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; padding:8px 14px; border-radius:999px; background:var(--surface); border:1px solid var(--line);
    font-size:12.5px; font-weight:600; color:var(--ink-dim); cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--brand); color:var(--brand-ink); border-color:var(--brand);}

  .rubro-row{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:12px 12px; cursor:pointer;
  }
  .rubro-row .num{
    width:30px; height:30px; border-radius:9px; background:var(--chip-bg); color:var(--brand); flex:none;
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-weight:600; font-size:12px;
  }
  .rubro-row .mid{flex:1; min-width:0;}
  .rubro-row .desc{font-size:13.5px; font-weight:600; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rubro-row .meta{font-size:11.5px; color:var(--ink-dim); margin-top:2px; font-variant-numeric:tabular-nums;}
  .rubro-row .end{text-align:right; flex:none;}
  .rubro-row .total{font-family:'IBM Plex Mono'; font-weight:600; font-size:13.5px; font-variant-numeric:tabular-nums;}
  .rubro-row .chev{color:var(--ink-dim); margin-left:2px;}
  .rubro-row-inner{display:flex; align-items:center; width:100%; gap:10px;}

  .apu-head{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:var(--shadow);}
  .apu-head .cod{font-family:'IBM Plex Mono'; color:var(--brand); font-size:12px; font-weight:700;}
  .apu-head h2{font-family:'Manrope'; font-size:17px; margin:4px 0 10px; line-height:1.3;}
  .apu-head .stats{display:flex; gap:18px;}
  .apu-head .stat .k{font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em;}
  .apu-head .stat .v{font-family:'IBM Plex Mono'; font-weight:600; font-size:15px; margin-top:2px; font-variant-numeric:tabular-nums;}

  .grp{margin-bottom:18px;}
  .grp .grp-title{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .grp .dot{width:8px; height:8px; border-radius:50%;}
  .grp .grp-name{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim);}
  .grp .grp-sub{margin-left:auto; font-family:'IBM Plex Mono'; font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums;}

  table.datos{border-collapse:collapse; width:100%; font-size:12px;}
  table.datos th, table.datos td{padding:8px 9px; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
  table.datos thead th{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-dim); font-weight:700; border-bottom:1px solid var(--line);}
  table.datos thead th:first-child, table.datos td:first-child{text-align:left;}
  table.datos td:first-child{white-space:normal; max-width:150px;}
  table.datos tbody tr:not(:last-child) td{border-bottom:1px solid var(--line);}
  table.datos td.num{font-family:'IBM Plex Mono';}
  table.datos td.unid{color:var(--ink-dim); font-size:11px;}
  table.datos td.sub{font-weight:700;}
  table.datos tfoot td{border-top:1px dashed var(--line); font-weight:700; font-family:'IBM Plex Mono'; padding-top:9px;}
  table.datos tfoot td:first-child{font-family:'Manrope'; color:var(--ink); font-weight:700; font-size:12px;}
  .grp .table-wrap{margin-bottom:0; box-shadow:none;}
  .rubro-row .jump{

  }
  .rubro-row .jump svg{width:16px; height:16px;}
  tr.row-hl td{background:color-mix(in srgb, var(--brand) 16%, transparent) !important;}
  tr.row-hl td:first-child{box-shadow:inset 3px 0 0 var(--brand);}

  .resumen{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:8px;}

  .resumen .ln .l{color:var(--ink-dim);}
  .resumen .ln .r{font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums; font-weight:500;}

  .resumen .ln.total .l{font-weight:700; color:var(--ink);}
  .resumen .ln.total .r{font-weight:700; font-size:15px; color:var(--brand);}

  .datos-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
  .datos-card .dc-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--brand); margin-bottom:10px;}
  .datos-card .dl{display:flex; flex-direction:column; gap:11px;}
  .datos-card .dl .d{display:flex; flex-direction:column; gap:2px;}
  .datos-card .dl .k{font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em;}
  .datos-card .dl .v{font-size:13.5px; font-weight:500; line-height:1.4;}
  .datos-card .dl .v.money{font-family:'IBM Plex Mono'; font-weight:600; color:var(--brand); font-variant-numeric:tabular-nums;}
  .datos-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 12px;}

  .table-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); margin-bottom:16px;}
  table.crono{border-collapse:collapse; width:100%; font-size:12px;}
  table.crono th, table.crono td{padding:9px 10px; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
  table.crono thead th{
    font-family:'Manrope'; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-dim);
    border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface);
  }
  table.crono thead th:first-child, table.crono td:first-child{ text-align:left; position:sticky; left:0; background:var(--surface); }
  table.crono tbody tr:not(:last-child) td{border-bottom:1px solid var(--line);}
  table.crono td:first-child{font-weight:600; max-width:150px; overflow:hidden; text-overflow:ellipsis;}
  table.crono td.pct{font-family:'IBM Plex Mono';}
  table.crono td.pct.z{color:var(--ink-dim); opacity:.35;}
  table.crono tfoot td{border-top:1px dashed var(--line); font-weight:700; font-family:'IBM Plex Mono'; color:var(--brand); padding-top:10px;}
  table.crono tfoot td:first-child{font-family:'Manrope'; color:var(--ink); font-weight:700;}

  .period-summary{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow);}
  .period-summary .ps-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .period-summary h3{font-family:'Manrope'; font-size:14.5px; margin:0;}
  .period-summary .ps-money{font-family:'IBM Plex Mono'; font-weight:700; color:var(--brand); font-size:15px; font-variant-numeric:tabular-nums;}
  .res-row{display:grid; grid-template-columns:1fr auto auto; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:12.5px; align-items:center;}
  .res-row:last-child{border-bottom:none;}
  .res-row .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .res-row .qty{font-family:'IBM Plex Mono'; text-align:right; color:var(--ink-dim); font-variant-numeric:tabular-nums; font-size:12px;}
  .res-row .qty .u{font-size:10px; margin-left:2px;}
  .res-row .money{font-family:'IBM Plex Mono'; text-align:right; font-weight:600; font-variant-numeric:tabular-nums;}

  .empty-hint{font-size:12px; color:var(--ink-dim); text-align:center; padding:30px 20px;}

  [hidden]{display:none !important;}
</style>

const fmt$ = n => "$ " + n.toLocaleString("es-EC", {minimumFractionDigits:2, maximumFractionDigits:2});

// 💡 Búsqueda por PALABRA COMPLETA: "peón" tiene que encontrar "Peón de albañil" o "Peón 2",
// pero NO "campeón" ni "campeonato" — la coincidencia no puede estar pegada a otra letra o número
// (las vocales con tilde y la ñ cuentan como letra, para no cortar la palabra a la mitad).
function esLetraODigito(c){ return /[a-z0-9áéíóúüñ]/i.test(c); }
function coincideCompleta(texto, termino){
  if(!termino) return true;
  const t = (texto||"").toLowerCase();
  const q = termino.toLowerCase().trim();
  if(!q) return true;
  let desde = 0;
  while(true){
    const pos = t.indexOf(q, desde);
    if(pos === -1) return false;
    const antes = pos === 0 ? "" : t[pos-1];
    const despues = (pos+q.length >= t.length) ? "" : t[pos+q.length];
    if(!esLetraODigito(antes) && !esLetraODigito(despues)) return true;
    desde = pos + 1;
  }
}

  });
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);
  setTimeout(conectarBuscador);
  return wrap;
}

function renderValoradoTabla(){
  const p = state.proj;
  const n = p.cronoPeriodos.length;
  const rubros = p.rubros.filter(r => coincideCompleta(r.desc, state.search) || coincideCompleta(r.cod, state.search));

  const tableWrap = el(`<div class="table-wrap"></div>`);
  const table = el(`<table class="crono"></table>`);
  const thead = el(`<thead><tr></tr></thead>`);
  const trh = thead.querySelector("tr");
  trh.appendChild(el(`<th>Rubro</th>`));
  trh.appendChild(el(`<th>Unidad</th>`));
  trh.appendChild(el(`<th>Cantidad</th>`));
  trh.appendChild(el(`<th>P. Unit.</th>`));
  trh.appendChild(el(`<th>Total</th>`));
  p.cronoPeriodos.forEach(per=> trh.appendChild(el(`<th>${per}</th>`)));
  table.appendChild(thead);

  const tbody = el(`<tbody></tbody>`);
  const totalesPeriodo = new Array(n).fill(0);
  let filaResaltada = null;
  if(rubros.length === 0){
    tbody.appendChild(el(`<tr><td colspan="${5+n}" style="text-align:center; color:var(--ink-dim);">Ningún rubro coincide con "${state.search}".</td></tr>`));
  }
  rubros.forEach(r=>{
    const tr = el(`<tr></tr>`);
    if(state.highlightItem && r.item === state.highlightItem){ tr.classList.add("row-hl"); filaResaltada = tr; }
    tr.appendChild(el(`<td title="${r.desc}">${r.item}. ${r.desc}</td>`));
    tr.appendChild(el(`<td class="pct">${r.unidad}</td>`));
    tr.appendChild(el(`<td class="pct">${fmtNum(r.cant)}</td>`));
    tr.appendChild(el(`<td class="pct">${fmt$(r.pu)}</td>`));
    tr.appendChild(el(`<td class="pct">${fmt$(r.cant*r.pu)}</td>`));
    const crono = r.crono || new Array(n).fill(0);
    for(let i=0;i<n;i++){
      const pct = crono[i]||0;
      totalesPeriodo[i] += r.cant*r.pu*(pct/100);
      tr.appendChild(el(`<td class="pct${pct===0?' z':''}">${pct===0?'—':pct+'%'}</td>`));
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  const tfoot = el(`<tfoot><tr></tr></tfoot>`);
  const trf = tfoot.querySelector("tr");
  trf.appendChild(el(`<td>Total del periodo</td><td colspan="4"></td>`));
  totalesPeriodo.forEach(m => trf.appendChild(el(`<td>${fmt$(m)}</td>`)));
  table.appendChild(tfoot);

  tableWrap.appendChild(table);
  if(filaResaltada){
    setTimeout(()=> filaResaltada.scrollIntoView({block:"center", inline:"center", behavior:"smooth"}), 60);
  }
  return tableWrap;
}

function renderApu(){
  const r = state.rubro;
  const wrap = el(`<div></div>`);
  const total = r.cant * r.pu;
  wrap.appendChild(el(`
    <div class="apu-head">
      <div class="cod">${r.cod} &middot; ITEM ${r.item}</div>
      <h2>${r.desc}</h2>
      <div class="stats">
        <div class="stat"><div class="k">Unidad</div><div class="v">${r.unidad}</div></div>
        <div class="stat"><div class="k">Cantidad</div><div class="v">${fmtNum(r.cant)}</div></div>
        <div class="stat"><div class="k">P. Unitario</div><div class="v">${fmt$(r.pu)}</div></div>
        <div class="stat"><div class="k">P. Total</div><div class="v">${fmt$(total)}</div></div>
      </div>
    </div>
  `));

  if(!r.apu){
    wrap.appendChild(el(`<div class="empty-hint">Este rubro de ejemplo no trae el desglose del análisis — probá con "Trazado y replanteo" para ver el APU completo.</div>`));
    return wrap;
  }

  const colorGrupo = { "Materiales":"#D97C2B", "Mano de Obra":"#2B6E5C", "Equipo":"#5B6B63", "Transporte":"#6C7A89" };

  r.apu.grupos.forEach(g=>{
    const grp = el(`
      <div class="grp">
        <div class="grp-title">
          <div class="dot" style="background:${colorGrupo[g.nombre] || '#888'}"></div>
          <div class="grp-name">${g.nombre}</div>
          <div class="grp-sub">${fmt$(g.subtotal)}</div>
        </div>
      </div>
    `);
    const tableWrap = el(`<div class="table-wrap"></div>`);
    const table = el(`
      <table class="datos">
        <thead><tr><th>Descripción</th><th>Unidad</th><th>Cantidad</th><th>Precio</th><th>Rend.</th><th>Total</th></tr></thead>
        <tbody></tbody>
        <tfoot><tr><td>Subtotal ${g.nombre.toLowerCase()}</td><td colspan="4"></td><td>${fmt$(g.subtotal)}</td></tr></tfoot>
      </table>
    `);
    const tbody = table.querySelector("tbody");
    g.items.forEach(it=>{
      const esPct = it.unid === "%";
      tbody.appendChild(el(`
        <tr>
          <td>${it.nm}</td>
          <td class="unid">${it.unid}</td>
          <td class="num">${esPct ? it.cant.toFixed(1)+'%' : fmtNum(it.cant)}</td>
          <td class="num">${esPct ? '—' : fmt$(it.precio)}</td>
          <td class="num">${esPct ? '—' : fmtNum(it.rend||1)}</td>
          <td class="num sub">${fmt$(it.subtotal)}</td>
        </tr>
      `));
    });
    tableWrap.appendChild(table);
    grp.appendChild(tableWrap);
    wrap.appendChild(grp);
  });

  wrap.appendChild(el(`
    <div class="resumen">
      <div class="ln"><div class="l">Costo directo</div><div class="r">${fmt$(r.apu.costoDirecto)}</div></div>
      <div class="ln"><div class="l">Indirectos</div><div class="r">${fmt$(r.apu.costoIndirecto)}</div></div>
      <div class="ln total"><div class="l">Precio unitario</div><div class="r">${fmt$(r.apu.precioOferta)}</div></div>
    </div>
  `));

  return wrap;
}

cargarProyectosGuardados();
render();

// 💡 Registra el service worker (lo que permite instalarse como app y funcionar sin internet).
// Si el navegador no lo soporta o algo falla, la app sigue funcionando igual, solo sin esa parte.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
