<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETR Visor de Obra</title>
<meta name="description" content="Visor móvil de ETR APUS PRO: datos generales, presupuesto, análisis de precios y cronograma." />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B6E5C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12211C" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ETR Visor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    color-scheme: light;
    --bg:#F3F1EC;
    --surface:#FFFFFF;
    --surface-2:#EDEAE2;
    --ink:#1C2521;
    --ink-dim:#5B6B63;
    --line:#DEDACD;
    --brand:#2B6E5C;
    --brand-ink:#F4FBF7;
    --amber:#D97C2B;
    --amber-ink:#3A2205;
    --danger:#B3432E;
    --ok:#2B6E5C;
    --chip-bg:#E4EEE9;
    --shadow: 0 1px 2px rgba(28,37,33,.06), 0 6px 20px -8px rgba(28,37,33,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#12211C;
      --surface:#17281F;
      --surface-2:#1D3126;
      --ink:#EAF2EC;
      --ink-dim:#9FB8AB;
      --line:#28402F;
      --brand:#59C6A0;
      --brand-ink:#092F23;
      --amber:#F0A15D;
      --amber-ink:#2C1600;
      --danger:#F0876F;
      --ok:#59C6A0;
      --chip-bg:#1F3A2C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.55);
    }
  }
  
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#12211C; --surface:#17281F; --surface-2:#1D3126; --ink:#EAF2EC; --ink-dim:#9FB8AB;
    --line:#28402F; --brand:#59C6A0; --brand-ink:#092F23; --amber:#F0A15D; --amber-ink:#2C1600;
    --danger:#F0876F; --ok:#59C6A0; --chip-bg:#1F3A2C; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    padding:0 max(16px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px, env(safe-area-inset-left,0px));
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    height:100%;
  }
  html{height:100%;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  .app{max-width:460px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

  .badge-demo{
    display:flex; align-items:center; gap:6px; justify-content:center;
    font-size:11px; font-weight:600; color:var(--ink-dim); letter-spacing:.04em; text-transform:uppercase;
    padding:8px 0 2px;
  }
  .badge-demo svg{width:12px; height:12px; flex:none;}

  header.top{
    max-height:40vh; overflow-y:auto;
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    background:var(--bg);
    padding-top:6px; padding-bottom:10px;
    display:flex; align-items:center; gap:10px;
  }
  header.top .back{
    width:36px; height:36px; border-radius:11px; border:1px solid var(--line);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    flex:none; color:var(--ink); cursor:pointer;
  }
  header.top .back svg{width:18px; height:18px;}
  header.top .titles{min-width:0; flex:1;}
  header.top h1{font-family:'Manrope',sans-serif; font-weight:800; font-size:18px; margin:0; line-height:1.15;
    overflow-wrap:anywhere;}
  header.top .sub{font-size:12px; color:var(--ink-dim); margin-top:1px; overflow-wrap:anywhere;}

  .brandmark{display:flex; align-items:center; gap:8px; padding:10px 0 6px;}
  .brandmark .mark{
    width:34px; height:34px; border-radius:10px; background:var(--brand); color:var(--brand-ink);
    display:flex; align-items:center; justify-content:center; font-family:'Manrope'; font-weight:800; font-size:15px;
    flex:none;
  }
  .brandmark .name{font-family:'Manrope'; font-weight:800; font-size:17px;}
  .brandmark .tag{font-size:11px; color:var(--ink-dim);}

  main{flex:1; padding-bottom:28px;}

  /* Pantallas anchas (celular girado o tablet): más espacio para las tablas */
  @media (min-width:700px){ .app{max-width:760px;} }
  @media (min-width:1100px){ .app{max-width:980px;} }
  @media (orientation:landscape) and (max-height:480px){
    header.top{position:static;}
    .brandmark{padding:4px 0 2px;}
  }

  .search{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; margin:4px 0 14px;
  }
  .search svg{width:16px; height:16px; color:var(--ink-dim); flex:none;}
  .search input{
    border:none; outline:none; background:transparent; color:var(--ink); font-size:14px; width:100%;
    font-family:'IBM Plex Sans';
  }
  .search input::placeholder{color:var(--ink-dim);}

  .section-label{font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-dim); margin:18px 2px 8px;}
  .section-label:first-child{margin-top:0;}

  .card-list{display:flex; flex-direction:column; gap:10px;}

  .proj-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 14px;
    box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column; gap:8px;
  }
  .proj-card .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .proj-card .cod{font-family:'IBM Plex Mono'; font-size:11px; color:var(--brand); font-weight:600; letter-spacing:.03em;}
  .proj-card .row1 > div:first-child{min-width:0;}
  .proj-card h3{font-family:'Manrope'; font-size:15.5px; font-weight:700; margin:2px 0 0; line-height:1.25; overflow-wrap:anywhere;}
  .proj-card .cli{font-size:12.5px; color:var(--ink-dim); margin-top:2px;}
  .proj-card .row2{display:flex; justify-content:space-between; align-items:center; margin-top:2px;}
  .proj-card .total{font-family:'IBM Plex Mono'; font-weight:600; font-size:15px; font-variant-numeric:tabular-nums;}
  .proj-card .pct-pill{
    flex:none;
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--chip-bg); color:var(--brand);
    font-variant-numeric:tabular-nums;
  }
  .proj-card .bar-track{height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
  .proj-card .bar-fill{height:100%; background:var(--brand); border-radius:99px;}

  .tabs{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:13px; margin-bottom:14px;}
  .tabs button{
    flex:1; min-width:0; border:none; background:transparent; padding:9px 6px; border-radius:10px; font-size:12.5px;
    font-weight:700; color:var(--ink-dim); font-family:'Manrope'; cursor:pointer;
  }
  .tabs button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}

  .chiprow{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; margin:0 -2px;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; min-height:36px; padding:8px 14px; border-radius:999px; background:var(--surface); border:1px solid var(--line);
    font-size:12.5px; font-weight:600; color:var(--ink-dim); cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--brand); color:var(--brand-ink); border-color:var(--brand);}

  .rubro-row{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:12px 12px; cursor:pointer;
  }
  .rubro-row .num{
    min-width:30px; height:30px; padding:0 4px; border-radius:9px; background:var(--chip-bg); color:var(--brand); flex:none;
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-weight:600; font-size:12px;
  }
  .rubro-row .mid{flex:1; min-width:0;}
  .rubro-row .desc{font-size:13.5px; font-weight:600; line-height:1.3; overflow-wrap:anywhere;}
  .rubro-row .meta{overflow-wrap:anywhere; font-size:11.5px; color:var(--ink-dim); margin-top:2px; font-variant-numeric:tabular-nums;}
  .rubro-row .end{text-align:right; flex:none; max-width:38%; overflow-wrap:anywhere;}
  .rubro-row .total{font-family:'IBM Plex Mono'; font-weight:600; font-size:13.5px; font-variant-numeric:tabular-nums;}
  .rubro-row .chev{color:var(--ink-dim); margin-left:2px;}
  .rubro-row-inner{display:flex; align-items:center; width:100%; gap:10px;}

  .apu-head{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:var(--shadow);}
  .apu-head .cod{font-family:'IBM Plex Mono'; color:var(--brand); font-size:12px; font-weight:700;}
  .apu-head h2{font-family:'Manrope'; font-size:17px; margin:4px 0 10px; line-height:1.3; overflow-wrap:anywhere;}
  .apu-head .stats{display:flex; flex-wrap:wrap; gap:10px 18px;}
  .apu-head .stat .k{font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em;}
  .apu-head .stat .v{font-family:'IBM Plex Mono'; font-weight:600; font-size:15px; margin-top:2px; font-variant-numeric:tabular-nums;}

  .grp{margin-bottom:18px;}
  .grp .grp-title{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .grp .dot{width:8px; height:8px; border-radius:50%;}
  .grp .grp-name{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim);}
  .grp .grp-sub{margin-left:auto; font-family:'IBM Plex Mono'; font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums;}

  table.datos{border-collapse:collapse; width:100%; font-size:12px;}
  table.datos th, table.datos td{padding:8px 9px; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
  table.datos thead th{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-dim); font-weight:700; border-bottom:1px solid var(--line);}
  table.datos thead th:first-child, table.datos td:first-child{text-align:left;}
  table.datos td:first-child{white-space:normal; min-width:120px; max-width:200px; overflow-wrap:anywhere;}
  table.datos tbody tr:not(:last-child) td{border-bottom:1px solid var(--line);}
  table.datos td.num{font-family:'IBM Plex Mono';}
  table.datos td.unid{color:var(--ink-dim); font-size:11px;}
  table.datos td.sub{font-weight:700;}
  table.datos tfoot td{border-top:1px dashed var(--line); font-weight:700; font-family:'IBM Plex Mono'; padding-top:9px;}
  table.datos tfoot td:first-child{font-family:'Manrope'; color:var(--ink); font-weight:700; font-size:12px;}
  .grp .table-wrap{margin-bottom:0; box-shadow:none;}
  .rubro-row .jump{
    flex:none; width:32px; height:32px; border-radius:9px; background:var(--chip-bg); color:var(--brand);
    display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;
  }
  .rubro-row .jump svg{width:16px; height:16px;}
  tr.row-hl td{background:color-mix(in srgb, var(--brand) 16%, transparent) !important;}
  tr.row-hl td:first-child{box-shadow:inset 3px 0 0 var(--brand);}

  .resumen{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:8px;}
  .resumen .ln{display:flex; justify-content:space-between; font-size:13px;}
  .resumen .ln .l{color:var(--ink-dim);}
  .resumen .ln .r{font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums; font-weight:500;}
  .resumen .ln.total{border-top:1px dashed var(--line); padding-top:10px; margin-top:2px;}
  .resumen .ln.total .l{font-weight:700; color:var(--ink);}
  .resumen .ln.total .r{font-weight:700; font-size:15px; color:var(--brand);}

  .datos-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
  .datos-card .dc-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--brand); margin-bottom:10px;}
  .datos-card .dl{display:flex; flex-direction:column; gap:11px;}
  .datos-card .dl .d{display:flex; flex-direction:column; gap:2px;}
  .datos-card .dl .k{font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em;}
  .datos-card .dl .v{font-size:13.5px; font-weight:500; line-height:1.4; overflow-wrap:anywhere;}
  .datos-card .dl .v.money{font-family:'IBM Plex Mono'; font-weight:600; color:var(--brand); font-variant-numeric:tabular-nums;}
  .datos-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 12px;}

  .table-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); margin-bottom:16px;}
  table.crono{border-collapse:collapse; width:100%; font-size:12px;}
  table.crono th, table.crono td{padding:9px 10px; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
  table.crono thead th{
    font-family:'Manrope'; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-dim);
    border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface);
  }
  table.crono thead th:first-child, table.crono td:first-child{ text-align:left; position:sticky; left:0; background:var(--surface); }
  table.crono tbody tr:not(:last-child) td{border-bottom:1px solid var(--line);}
  table.crono td:first-child{font-weight:600; white-space:normal; min-width:150px; max-width:220px; overflow-wrap:anywhere;}
  table.crono td.pct{font-family:'IBM Plex Mono';}
  table.crono td.pct.z{color:var(--ink-dim); opacity:.35;}
  table.crono tfoot td{border-top:1px dashed var(--line); font-weight:700; font-family:'IBM Plex Mono'; color:var(--brand); padding-top:10px;}
  table.crono tfoot td:first-child{font-family:'Manrope'; color:var(--ink); font-weight:700;}

  .period-summary{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow);}
  .period-summary .ps-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .period-summary h3{font-family:'Manrope'; font-size:14.5px; margin:0;}
  .period-summary .ps-money{font-family:'IBM Plex Mono'; font-weight:700; color:var(--brand); font-size:15px; font-variant-numeric:tabular-nums;}
  .res-row{display:grid; grid-template-columns:1fr auto auto; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:12.5px; align-items:center;}
  .res-row:last-child{border-bottom:none;}
  .res-row .nm{overflow-wrap:anywhere;}
  .res-row .qty{font-family:'IBM Plex Mono'; text-align:right; color:var(--ink-dim); font-variant-numeric:tabular-nums; font-size:12px;}
  .res-row .qty .u{font-size:10px; margin-left:2px;}
  .res-row .money{font-family:'IBM Plex Mono'; text-align:right; font-weight:600; font-variant-numeric:tabular-nums;}

  .error-box{background:var(--surface); border:1px solid var(--danger); border-radius:16px; padding:18px; margin-top:20px; text-align:center;}
  .error-box p{margin:0 0 12px; font-size:13.5px; line-height:1.4;}
  .error-box button{background:var(--brand); color:var(--brand-ink); border:none; padding:11px 22px; border-radius:12px; font-family:'Manrope'; font-weight:700; font-size:13.5px; cursor:pointer;}
  .empty-hint{font-size:12px; color:var(--ink-dim); text-align:center; padding:30px 20px;}

  [hidden]{display:none !important;}
</style>
</head>
<body>

<div class="app">
  <div class="badge-demo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>

  </div>

  <header class="top" id="topbar">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

    <div class="titles" id="topTitles">
      <div class="brandmark" id="brandmark">

      <h1 id="pageTitle" hidden></h1>
      <div class="sub" id="pageSub" hidden></div>

  <main id="main"></main>
</div>

// Formato ecuatoriano: coma para decimales y punto para miles (1.250,50).
// Se arma a mano (sin toLocaleString) porque algunos celulares Android no traen el idioma es-EC
// y mostrarían el punto decimal en vez de la coma.
function fmtN(n, min, max){
  n = Number(n);
  if(!isFinite(n)) return "—";
  const abs = Math.abs(n);
  if(abs >= 1e15) return String(n);
  let [ent, dec=""] = abs.toFixed(max).split(".");
  while(dec.length > min && dec.endsWith("0")) dec = dec.slice(0,-1);
  ent = ent.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const neg = n < 0 && /[1-9]/.test(ent + dec);
  return (neg ? "-" : "") + ent + (dec ? "," + dec : "");
}
const fmt$ = n => "$\u00a0" + fmtN(n, 2, 2);   // espacio sin corte: el $ nunca queda solo al final de la línea
const fmtNum = n => fmtN(n, 2, 4);      // cantidades: 2 decimales, hasta 4 si hacen falta (0,002)
const fmtPct = n => fmtN(n, 2, 2) + "%";

// Todo texto que viene de un archivo importado se "escapa" antes de mostrarlo,
// para que un nombre con < > & o comillas no rompa la pantalla.
function esc(v){
  return (v == null ? "" : String(v)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ==========================================================================
// VALIDACIÓN DE PROYECTOS — un archivo incompleto o con datos raros nunca debe
// tumbar la app: se rellenan los campos que falten con valores seguros.
// ==========================================================================
const num = (x, def=0) => { const n = (typeof x === "string" && x.trim() === "") ? NaN : Number(x); return isFinite(n) ? n : def; };
const txt = x => (x == null ? "" : String(x));
const esObjeto = x => x !== null && typeof x === "object" && !Array.isArray(x);

function normalizarApu(a){
  if(!esObjeto(a) || !Array.isArray(a.grupos)) return undefined;
  return {
    ...a,
    grupos: a.grupos.filter(esObjeto).map(g => ({
      ...g, nombre: txt(g.nombre), subtotal: num(g.subtotal),
      items: (Array.isArray(g.items) ? g.items : []).filter(esObjeto).map(it => ({
        ...it, nm: txt(it.nm), unid: txt(it.unid), cant: num(it.cant), precio: num(it.precio), rend: num(it.rend, 1), subtotal: num(it.subtotal),
      })),
    })),
    costoDirecto: num(a.costoDirecto), costoIndirecto: num(a.costoIndirecto), precioOferta: num(a.precioOferta),
  };
}

// Devuelve el proyecto limpio, o null si el archivo no es un proyecto reconocible.
function normalizarProyecto(p){
  if(!esObjeto(p) || !txt(p.cod).trim() || !txt(p.nombre).trim() || !Array.isArray(p.rubros)) return null;
  const rubrosCrudos = p.rubros.filter(esObjeto);
  let n = Array.isArray(p.cronoPeriodos) ? p.cronoPeriodos.length : 0;
  rubrosCrudos.forEach(r => { if(Array.isArray(r.crono)) n = Math.max(n, r.crono.length); });
  const cronoPeriodos = Array.from({length: Math.max(n,1)}, (_,i) => (Array.isArray(p.cronoPeriodos) && p.cronoPeriodos[i] != null) ? txt(p.cronoPeriodos[i]) : "Periodo " + (i+1));
  const rubros = rubrosCrudos.map((r,i) => ({
    ...r, item: txt(r.item != null ? r.item : i+1), cod: txt(r.cod), desc: txt(r.desc), unidad: txt(r.unidad),
    cant: num(r.cant), pu: num(r.pu),
    crono: Array.from({length: cronoPeriodos.length}, (_,k) => num(Array.isArray(r.crono) ? r.crono[k] : 0)),
    apu: normalizarApu(r.apu),
  }));
  const recursos = {};
  if(esObjeto(p.recursos)) Object.keys(p.recursos).forEach(tipo => {
    if(!Array.isArray(p.recursos[tipo])) return;
    recursos[tipo] = p.recursos[tipo].filter(esObjeto).map(it => ({
      ...it, nm: txt(it.nm), unid: txt(it.unid), precio: num(it.precio),
      cantPeriodo: Array.from({length: cronoPeriodos.length}, (_,k) => num(Array.isArray(it.cantPeriodo) ? it.cantPeriodo[k] : 0)),
    }));
  });
  const d = esObjeto(p.datos) ? p.datos : {};
  const datos = {...d};
  ["institucion","proyecto","ubicacion","oferente","firma","cargo","ciudad","fecha","plazo","registroProfesional","nota"].forEach(k => datos[k] = txt(d[k]));
  datos.pctIndirectos = num(d.pctIndirectos); datos.pctUtilidad = num(d.pctUtilidad);
  const sumaRubros = rubros.reduce((acc,r) => acc + r.cant*r.pu, 0);
  return {
    ...p, cod: txt(p.cod).trim(), nombre: txt(p.nombre).trim(), cliente: txt(p.cliente || datos.institucion),
    total: num(p.total, sumaRubros), avance: Math.min(100, Math.max(0, num(p.avance))),
    datos, rubros, cronoPeriodos, recursos,
  };
}

// 💡 Búsqueda por PALABRA COMPLETA: "peón" tiene que encontrar "Peón de albañil" o "Peón 2",
// pero NO "campeón" ni "campeonato" — la coincidencia no puede estar pegada a otra letra o número
// (las vocales con tilde y la ñ cuentan como letra, para no cortar la palabra a la mitad).
function esLetraODigito(c){ return /[a-z0-9áéíóúüñ]/i.test(c); }
function coincideCompleta(texto, termino){
  if(!termino) return true;
  const t = (texto||"").toLowerCase();
  const q = termino.toLowerCase().trim();
  if(!q) return true;
  let desde = 0;
  while(true){
    const pos = t.indexOf(q, desde);
    if(pos === -1) return false;
    const antes = pos === 0 ? "" : t[pos-1];
    const despues = (pos+q.length >= t.length) ? "" : t[pos+q.length];
    if(!esLetraODigito(antes) && !esLetraODigito(despues)) return true;
    desde = pos + 1;
  }
}

// ==========================================================================
// ACTIVACIÓN (candado de la app) — cada celular genera su propio "código de
// equipo" (Device ID) al primer uso. Ese código se le manda al proveedor por
// WhatsApp, y el proveedor devuelve una clave de activación firmada con su
// llave privada (que nunca sale de su computadora — ver generador_licencias.html,
// que NO se publica). El celular solo tiene la llave PÚBLICA de abajo, así que
// puede comprobar que la clave es auténtica y le pertenece a ESTE equipo, pero
// nadie puede fabricar claves nuevas leyendo este código fuente.
//
// Si algún cliente deja de pagar / hay que dar de baja un equipo, se agrega su
// Device ID a LICENCIAS_REVOCADAS abajo y se vuelve a publicar la app.
// ==========================================================================
const LICENCIA_PUBLIC_KEY_JWK = {"crv":"P-256","ext":true,"key_ops":["verify"],"kty":"EC","x":"2ghdFT3vqdE6w65s3tCn7tF37VdIEmQzMv0w9X-PTlw","y":"4s1rdcJ53I52qlSYOtoPw-NgYlmJB1JGqhLqjuDNEaY"};
const LICENCIAS_REVOCADAS = []; // Device IDs dados de baja (ej: "AB12-CD34-EF56")

function b64urlABytes(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

function obtenerDeviceId(){
  try {
    let id = localStorage.getItem("etr_device_id");
    if(!id){
      const b = crypto.getRandomValues(new Uint8Array(6));
      const hex = Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();
      id = hex.match(/.{1,4}/g).join("-");
      localStorage.setItem("etr_device_id", id);
    }
    return id;
  } catch(e){ return "SIN-ID-0000"; }
}

function estaActivado(){
  try {
    const lic = JSON.parse(localStorage.getItem("etr_licencia") || "null");
    if(!lic) return false;
    if(lic.d !== obtenerDeviceId()) return false;
    if(LICENCIAS_REVOCADAS.includes(lic.d)) return false;
    if(lic.x && new Date(lic.x) < new Date()) return false;
    return true;
  } catch(e){ return false; }
}

async function activar(codigo){
  try {
    codigo = (codigo || "").trim();
    const partes = codigo.split(".");
    if(partes.length !== 2) return { ok:false, error:"Formato de código inválido." };
    const [payloadB64, sigB64] = partes;
    const payload = JSON.parse(new TextDecoder().decode(b64urlABytes(payloadB64)));

    if(payload.d !== obtenerDeviceId()) return { ok:false, error:"Este código no es para este celular." };
    if(LICENCIAS_REVOCADAS.includes(payload.d)) return { ok:false, error:"Este equipo fue dado de baja." };
    if(payload.x && new Date(payload.x) < new Date()) return { ok:false, error:"Este código ya venció." };

    const clavePublica = await crypto.subtle.importKey("jwk", LICENCIA_PUBLIC_KEY_JWK, {name:"ECDSA", namedCurve:"P-256"}, true, ["verify"]);
    const firmaValida = await crypto.subtle.verify(
      {name:"ECDSA", hash:"SHA-256"}, clavePublica,
      b64urlABytes(sigB64), new TextEncoder().encode(payloadB64)
    );
    if(!firmaValida) return { ok:false, error:"Código inválido o adulterado." };

    localStorage.setItem("etr_licencia", JSON.stringify(payload));
    return { ok:true };
  } catch(e){
    return { ok:false, error:"No se pudo leer el código. Revísalo e inténtalo de nuevo." };
  }
}

function cargarProyectosGuardados(){
  DATA.proyectos = DATA.proyectos.map(normalizarProyecto).filter(Boolean);
  try {
    const extra = JSON.parse(localStorage.getItem("etr_proyectos_importados") || "[]");
    if(!Array.isArray(extra)) return;
    extra.forEach(crudo => {
      const p = normalizarProyecto(crudo);   // un proyecto guardado dañado simplemente se omite
      if(p && !DATA.proyectos.some(x=>x.cod===p.cod)) DATA.proyectos.push(p);
    });
  } catch(e){}
}
// Devuelve true si se pudo guardar en el celular (puede fallar si no hay espacio o el modo privado lo bloquea).
function guardarProyectoImportado(p){
  try {
    let extra = JSON.parse(localStorage.getItem("etr_proyectos_importados") || "[]");
    if(!Array.isArray(extra)) extra = [];
    extra.push(p);
    localStorage.setItem("etr_proyectos_importados", JSON.stringify(extra));
    return true;
  } catch(e){ return false; }
}

  wrap.appendChild(el(`<div id="importMsg" role="status" style="font-size:12px; line-height:1.35; color:var(--ink-dim); text-align:center; min-height:14px; margin-bottom:10px;"></div>`));

  wrap.appendChild(el(`
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchProj" placeholder="Buscar proyecto o cliente..." value="${esc(state.search)}"/>
    </div>
  `));
  wrap.appendChild(el(`<div class="section-label">Tus proyectos</div>`));
  const list = el(`<div class="card-list"></div>`);
  const filtrados = DATA.proyectos.filter(p => coincideCompleta(p.nombre, state.search) || coincideCompleta(p.cliente, state.search));
  if(filtrados.length === 0){
    list.appendChild(el(`<div class="empty-hint">No hay proyectos que coincidan con "${esc(state.search)}".</div>`));
  }
  filtrados.forEach(p=>{
    const card = el(`
      <div class="proj-card">
        <div class="row1">
          <div>
            <div class="cod">${esc(p.cod)}</div>
            <h3>${esc(p.nombre)}</h3>
            <div class="cli">${esc(p.cliente)}</div>
          </div>
          <div class="pct-pill">${fmtN(p.avance,0,1)}%</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.max(0,Number(p.avance)||0))}%"></div></div>
        <div class="row2">
          <div class="total">${fmt$(p.total)}</div>
        </div>
      </div>
    `);
    card.addEventListener("click", ()=> go({view:"project", proj:p, projTab:"datos", search:"", cronoTab:"Valorado", periodo:0, highlightItem:null}));
    list.appendChild(card);
  });
  wrap.appendChild(list);

  wrap.querySelector("#searchProj").addEventListener("input", (e)=>{ state.search = e.target.value; render(); document.getElementById("searchProj").focus(); document.getElementById("searchProj").selectionStart = document.getElementById("searchProj").value.length; });

  const msg = wrap.querySelector("#importMsg");
  if(avisoImport){ msg.style.color = avisoImport.ok ? "var(--brand)" : "var(--danger)"; msg.textContent = avisoImport.texto; }
  // El mensaje se guarda aparte porque al agregar un proyecto la pantalla se vuelve a dibujar.
  function avisar(texto, ok){ avisoImport = {texto, ok}; render(); }
  const TAM_MAX = 8 * 1024 * 1024;   // 8 MB: un proyecto normal pesa muy por debajo
  function agregarProyecto(crudo){
    const p = normalizarProyecto(crudo);
    if(!p){ avisar("Ese archivo no tiene la forma de un proyecto de ETR APUS PRO.", false); return; }
    if(DATA.proyectos.some(x=>x.cod===p.cod)){ avisar(`Ya tenías cargado ${p.cod} — no se volvió a sumar.`, false); return; }
    DATA.proyectos.push(p);
    if(guardarProyectoImportado(crudo)) avisar(`"${p.nombre}" se agregó a tu lista (se guardó en este celular).`, true);
    else avisar(`"${p.nombre}" se agregó, pero no se pudo guardar en este celular (poco espacio). Al cerrar la app tendrás que importarlo otra vez.`, false);
  }
  wrap.querySelector("#fileImport").addEventListener("change", (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size === 0){ avisar("El archivo está vacío. Vuelve a exportarlo desde ETR APUS PRO.", false); return; }
    if(file.size > TAM_MAX){ avisar("El archivo es demasiado grande para abrirlo en el celular.", false); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      let crudo;
      try { crudo = JSON.parse(String(reader.result).replace(/^\uFEFF/, "").trim() || "null"); }
      catch(err){ avisar("No se pudo leer ese archivo: está dañado o no es el que genera ETR APUS PRO. Vuelve a exportarlo.", false); return; }
      try { agregarProyecto(crudo); }
      catch(err){ avisar("No se pudo agregar ese proyecto. El archivo parece estar incompleto.", false); }
    };
    reader.onerror = ()=> avisar("No se pudo abrir el archivo. Inténtalo de nuevo.", false);
    reader.readAsText(file);
  });
  wrap.querySelector("#btnEjemplo").addEventListener("click", ()=> agregarProyecto(JSON.parse(JSON.stringify(PROYECTO_EJEMPLO_IMPORT))));

  return wrap;
}

function renderProject(){
  const wrap = el(`<div></div>`);
  const tabs = el(`
    <div class="tabs">
      <button data-t="datos">Datos</button>
      <button data-t="presupuesto">Presupuesto</button>
      <button data-t="cronograma">Cronograma</button>
    </div>
  `);
  tabs.querySelectorAll("button").forEach(b=>{
    if(b.dataset.t === state.projTab) b.classList.add("active");
    b.addEventListener("click", ()=>{ state.projTab = b.dataset.t; state.search=""; render(); });
  });
  wrap.appendChild(tabs);

  if(state.projTab === "datos"){
    wrap.appendChild(renderDatos());
  } else if(state.projTab === "presupuesto"){
    wrap.appendChild(el(`
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchRub" placeholder="Buscar rubro o código..." value="${esc(state.search)}"/>
      </div>
    `));
    const list = el(`<div class="card-list"></div>`);
    const rubros = state.proj.rubros.filter(r => coincideCompleta(r.desc, state.search) || coincideCompleta(r.cod, state.search));
    rubros.forEach(r=>{
      const row = el(`
        <div class="rubro-row">
          <div class="rubro-row-inner">
            <div class="num">${esc(r.item)}</div>
            <div class="mid">
              <div class="desc">${esc(r.desc)}</div>
              <div class="meta">${esc(r.cod)} &middot; ${fmtNum(r.cant)} ${esc(r.unidad)} &times; ${fmt$(r.pu)}</div>
            </div>
            <div class="end">
              <div class="total">${fmt$(r.cant * r.pu)}</div>
            </div>
            <button class="jump" title="Ver en el Cronograma">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            </button>
            <div class="chev">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </div>
          </div>
        </div>
      `);
      row.querySelector(".jump").addEventListener("click", (ev)=>{
        ev.stopPropagation();
        go({view:"project", projTab:"cronograma", cronoTab:"Valorado", highlightItem:r.item});
      });
      row.addEventListener("click", ()=> go({view:"apu", rubro:r}));
      list.appendChild(row);
    });
    if(rubros.length === 0) list.appendChild(el(`<div class="empty-hint">${state.search ? `Ningún rubro coincide con "${esc(state.search)}".` : "Este proyecto no trae rubros."}</div>`));
    wrap.appendChild(list);
    setTimeout(()=>{
      const inp = wrap.querySelector("#searchRub");
      if(inp){ inp.addEventListener("input", (e)=>{ state.search = e.target.value; render(); const i2=document.getElementById("searchRub"); i2.focus(); i2.selectionStart=i2.value.length; }); }
    });
  } else {
    wrap.appendChild(renderCronograma());
  }
  return wrap;
}

        <div class="d"><div class="k">Plazo</div><div class="v">${esc(d.plazo) || "—"}</div></div>

function renderCronograma(){
  const wrap = el(`<div></div>`);
  const p = state.proj;
  const tiposDisponibles = ["Valorado", ...Object.keys(p.recursos)];
  const chips = el(`<div class="chiprow"></div>`);
  tiposDisponibles.forEach(t=>{
    const c = el(`<div class="chip">${esc(t)}</div>`);
    if(t === state.cronoTab) c.classList.add("active");
    c.addEventListener("click", ()=>{ state.cronoTab = t; state.periodo = 0; state.search=""; render(); });
    chips.appendChild(c);
  });
  wrap.appendChild(chips);

  wrap.appendChild(el(`
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchCrono" placeholder="Buscar rubro o insumo (palabra completa)..." value="${esc(state.search)}"/>
    </div>
  `));

  if(state.cronoTab === "Valorado"){
    wrap.appendChild(renderValoradoTabla());
    setTimeout(()=>{
      const inp = wrap.querySelector("#searchCrono");
      if(inp){ inp.addEventListener("input", (e)=>{ state.search = e.target.value; render(); const i2=document.getElementById("searchCrono"); i2.focus(); i2.selectionStart=i2.value.length; }); }
    });
    return wrap;
  }

  const chipsPeriodo = el(`<div class="chiprow"></div>`);
  p.cronoPeriodos.forEach((per, i)=>{
    const c = el(`<div class="chip">${esc(per)}</div>`);
    if(i === state.periodo) c.classList.add("active");
    c.addEventListener("click", ()=>{ state.periodo = i; render(); });
    chipsPeriodo.appendChild(c);
  });
  wrap.appendChild(chipsPeriodo);

  const items = (p.recursos[state.cronoTab] || []).filter(it => coincideCompleta(it.nm, state.search));
  const totalPeriodo = items.reduce((s,it)=> s + (it.cantPeriodo[state.periodo]||0)*it.precio, 0);

  wrap.appendChild(el(`
    <div class="period-summary" style="margin-bottom:12px;">
      <div class="ps-head" style="margin:0;">
        <h3>Se necesita en ${esc(String(p.cronoPeriodos[state.periodo] || "").toLowerCase())}</h3>
        <div class="ps-money">${fmt$(totalPeriodo)}</div>
      </div>
    </div>
  `));

  function conectarBuscador(){
    const inp = wrap.querySelector("#searchCrono");
    if(inp){ inp.addEventListener("input", (e)=>{ state.search = e.target.value; render(); const i2=document.getElementById("searchCrono"); i2.focus(); i2.selectionStart=i2.value.length; }); }
  }

  if(items.length === 0){
    wrap.appendChild(el(`<div class="empty-hint">${state.search ? `Ningún insumo coincide con "${esc(state.search)}".` : "Sin datos para este periodo."}</div>`));
    setTimeout(conectarBuscador);
    return wrap;
  }

  const tableWrap = el(`<div class="table-wrap"></div>`);
  const table = el(`
    <table class="datos">
      <thead><tr><th>Descripción</th><th>Unidad</th><th>Cantidad</th><th>P. Unit.</th><th>Total</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><td>Total ${esc(state.cronoTab.toLowerCase())}</td><td colspan="3"></td><td>${fmt$(totalPeriodo)}</td></tr></tfoot>
    </table>
  `);
  const tbody = table.querySelector("tbody");
  items.forEach(it=>{
    const cant = it.cantPeriodo[state.periodo] || 0;
    tbody.appendChild(el(`
      <tr>
        <td>${esc(it.nm)}</td>
        <td class="unid">${esc(it.unid)}</td>
        <td class="num">${fmtNum(cant)}</td>
        <td class="num">${fmt$(it.precio)}</td>
        <td class="num sub">${fmt$(cant*it.precio)}</td>
      </tr>
    `));
  });
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);
  setTimeout(conectarBuscador);
  return wrap;
}

function renderValoradoTabla(){
  const p = state.proj;
  const n = p.cronoPeriodos.length;
  const rubros = p.rubros.filter(r => coincideCompleta(r.desc, state.search) || coincideCompleta(r.cod, state.search));

  const tableWrap = el(`<div class="table-wrap"></div>`);
  const table = el(`<table class="crono"></table>`);
  const thead = el(`<thead><tr></tr></thead>`);
  const trh = thead.querySelector("tr");
  trh.appendChild(el(`<th>Rubro</th>`));
  trh.appendChild(el(`<th>Unidad</th>`));
  trh.appendChild(el(`<th>Cantidad</th>`));
  trh.appendChild(el(`<th>P. Unit.</th>`));
  trh.appendChild(el(`<th>Total</th>`));
  p.cronoPeriodos.forEach(per=> trh.appendChild(el(`<th>${esc(per)}</th>`)));
  table.appendChild(thead);

  const tbody = el(`<tbody></tbody>`);
  const totalesPeriodo = new Array(n).fill(0);
  let filaResaltada = null;
  if(rubros.length === 0){
    tbody.appendChild(el(`<tr><td colspan="${5+n}" style="text-align:center; color:var(--ink-dim);">Ningún rubro coincide con "${esc(state.search)}".</td></tr>`));
  }
  rubros.forEach(r=>{
    const tr = el(`<tr></tr>`);
    if(state.highlightItem && r.item === state.highlightItem){ tr.classList.add("row-hl"); filaResaltada = tr; }
    tr.appendChild(el(`<td title="${esc(r.desc)}">${esc(r.item)}. ${esc(r.desc)}</td>`));
    tr.appendChild(el(`<td class="pct">${esc(r.unidad)}</td>`));
    tr.appendChild(el(`<td class="pct">${fmtNum(r.cant)}</td>`));
    tr.appendChild(el(`<td class="pct">${fmt$(r.pu)}</td>`));
    tr.appendChild(el(`<td class="pct">${fmt$(r.cant*r.pu)}</td>`));
    const crono = r.crono;
    for(let i=0;i<n;i++){
      const pct = crono[i]||0;
      totalesPeriodo[i] += r.cant*r.pu*(pct/100);
      tr.appendChild(el(`<td class="pct${pct===0?' z':''}">${pct===0?'—':fmtN(pct,0,2)+'%'}</td>`));
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  const tfoot = el(`<tfoot><tr></tr></tfoot>`);
  const trf = tfoot.querySelector("tr");
  trf.appendChild(el(`<td>Total del periodo</td><td colspan="4"></td>`));
  totalesPeriodo.forEach(m => trf.appendChild(el(`<td>${fmt$(m)}</td>`)));
  table.appendChild(tfoot);

  tableWrap.appendChild(table);
  if(filaResaltada){
    setTimeout(()=> filaResaltada.scrollIntoView({block:"center", inline:"center", behavior:"smooth"}), 60);
  }
  return tableWrap;
}

function renderApu(){
  const r = state.rubro;
  const wrap = el(`<div></div>`);
  const total = r.cant * r.pu;
  wrap.appendChild(el(`
    <div class="apu-head">
      <div class="cod">${esc(r.cod)} &middot; ITEM ${esc(r.item)}</div>
      <h2>${esc(r.desc)}</h2>
      <div class="stats">
        <div class="stat"><div class="k">Unidad</div><div class="v">${esc(r.unidad)}</div></div>
        <div class="stat"><div class="k">Cantidad</div><div class="v">${fmtNum(r.cant)}</div></div>
        <div class="stat"><div class="k">P. Unitario</div><div class="v">${fmt$(r.pu)}</div></div>
        <div class="stat"><div class="k">P. Total</div><div class="v">${fmt$(total)}</div></div>
      </div>
    </div>
  `));

  if(!r.apu){
    wrap.appendChild(el(`<div class="empty-hint">Este rubro no trae el desglose del análisis de precios.</div>`));
    return wrap;
  }

  const colorGrupo = { "Materiales":"#D97C2B", "Mano de Obra":"#2B6E5C", "Equipo":"#5B6B63", "Transporte":"#6C7A89" };
  if(!r.apu.grupos.length){ wrap.appendChild(el(`<div class="empty-hint">Este rubro no trae el desglose del análisis de precios.</div>`)); return wrap; }

  r.apu.grupos.forEach(g=>{
    const grp = el(`
      <div class="grp">
        <div class="grp-title">
          <div class="dot" style="background:${colorGrupo[g.nombre] || '#888'}"></div>
          <div class="grp-name">${esc(g.nombre)}</div>
          <div class="grp-sub">${fmt$(g.subtotal)}</div>
        </div>
      </div>
    `);
    const tableWrap = el(`<div class="table-wrap"></div>`);
    const table = el(`
      <table class="datos">
        <thead><tr><th>Descripción</th><th>Unidad</th><th>Cantidad</th><th>Precio</th><th>Rend.</th><th>Total</th></tr></thead>
        <tbody></tbody>
        <tfoot><tr><td>Subtotal ${esc(g.nombre.toLowerCase())}</td><td colspan="4"></td><td>${fmt$(g.subtotal)}</td></tr></tfoot>
      </table>
    `);
    const tbody = table.querySelector("tbody");
    g.items.forEach(it=>{
      const esPct = it.unid === "%";
      tbody.appendChild(el(`
        <tr>
          <td>${esc(it.nm)}</td>
          <td class="unid">${esc(it.unid)}</td>
          <td class="num">${esPct ? fmtN(it.cant,1,2)+'%' : fmtNum(it.cant)}</td>
          <td class="num">${esPct ? '—' : fmt$(it.precio)}</td>
          <td class="num">${esPct ? '—' : fmtNum(it.rend||1)}</td>
          <td class="num sub">${fmt$(it.subtotal)}</td>
        </tr>
      `));
    });
    tableWrap.appendChild(table);
    grp.appendChild(tableWrap);
    wrap.appendChild(grp);
  });

  wrap.appendChild(el(`
    <div class="resumen">
      <div class="ln"><div class="l">Costo directo</div><div class="r">${fmt$(r.apu.costoDirecto)}</div></div>
      <div class="ln"><div class="l">Indirectos</div><div class="r">${fmt$(r.apu.costoIndirecto)}</div></div>
      <div class="ln total"><div class="l">Precio unitario</div><div class="r">${fmt$(r.apu.precioOferta)}</div></div>
    </div>
  `));

  return wrap;
}

cargarProyectosGuardados();
render();

// 💡 Registra el service worker (lo que permite instalarse como app y funcionar sin internet).
// Si el navegador no lo soporta o algo falla, la app sigue funcionando igual, solo sin esa parte.
// Dentro del APK propio (dominio appassets.androidplatform.net) NO se registra: ahí los archivos ya viajan dentro de la app.
if ("serviceWorker" in navigator && location.hostname !== "appassets.androidplatform.net") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
